openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: analysis
    description: Movement analysis operations
paths:
  /analyze:
    post:
      operationId: analyzeMovementClip
      tags: [analysis]
      summary: Analyze a movement clip
      description: >-
        Runs the gait_engine pipeline on an uploaded clip and returns
        measurements, factor scores, and a plain-language observation. The clip
        is processed in a temporary directory and deleted afterwards. This is an
        observational wellness result, never a diagnosis.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                video:
                  type: string
                  format: binary
                  description: Short walking clip (MP4, MOV, or WebM).
                petName:
                  type: string
                  description: Used only to address the pet in the observation text.
                previousOverall:
                  type: number
                  description: Overall score of the previous saved analysis.
                previousPipeline:
                  type: string
                  description: >-
                    Pipeline that produced previousOverall. Trends are only
                    compared when it matches the pipeline used for this run.
              required:
                - video
      responses:
        "200":
          description: Analysis finished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeResult"
        "400":
          description: The upload was missing or not a supported video
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeError"
        "413":
          description: The upload was larger than the beta limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeError"
        "502":
          description: The analysis pipeline could not produce a usable result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeError"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AnalyzeError:
      type: object
      description: A message the app can show to the user as-is.
      properties:
        ok:
          type: boolean
        error:
          type: string
      required:
        - ok
        - error
    AnalysisMeasurements:
      type: object
      description: >-
        Raw measurements from the clip. These describe what was measured and
        carry no interpretation.
      properties:
        frameCount:
          # Whole number of frames. Declared as number so the generated zod
          # stays compatible with the zod version pinned in the catalog.
          type: number
        durationSeconds:
          type: number
        meanKeypointConfidence:
          type: number
          nullable: true
        leftAnkleMotion:
          type: number
          nullable: true
        rightAnkleMotion:
          type: number
          nullable: true
        strideSymmetry:
          type: number
          nullable: true
        asymmetryPercent:
          type: number
          nullable: true
        motionMean:
          type: number
        motionStd:
          type: number
        motionCoverage:
          type: number
        hipStability:
          type: number
          nullable: true
        symmetryReliable:
          type: boolean
      required:
        - frameCount
        - durationSeconds
        - motionMean
        - motionStd
        - motionCoverage
        - symmetryReliable
    AnalysisFactors:
      type: object
      description: >-
        Factor scores from 0-100. A null value means there was not enough
        signal to score that factor; it never means zero.
      properties:
        movementConsistency:
          type: number
          nullable: true
        symmetry:
          type: number
          nullable: true
        mobility:
          type: number
          nullable: true
        activity:
          type: number
          nullable: true
        historicalChange:
          type: number
          nullable: true
    AnalysisWeights:
      type: object
      description: Weights used to blend the available factors into overallScore.
      properties:
        movementConsistency:
          type: number
        symmetry:
          type: number
        mobility:
          type: number
        activity:
          type: number
        historicalChange:
          type: number
    AnalyzeResult:
      type: object
      properties:
        ok:
          type: boolean
        pipeline:
          type: string
          description: >-
            movenet when pose landmarks were used, opencv-motion when only
            frame-to-frame picture change could be measured.
          enum:
            - movenet
            - opencv-motion
        signalQuality:
          type: string
          description: How much the measurements from this clip can be trusted.
          enum:
            - good
            - limited
            - unusable
        signalNote:
          type: string
          description: Plain-language reason for signalQuality, safe to display.
        measurements:
          $ref: "#/components/schemas/AnalysisMeasurements"
        factors:
          $ref: "#/components/schemas/AnalysisFactors"
        overallScore:
          type: number
          nullable: true
        strideSymmetryScore:
          type: number
          nullable: true
        asymmetryPercent:
          type: number
          nullable: true
        confidence:
          type: number
          nullable: true
        observation:
          type: string
          description: Plain-language interpretation built only from the values above.
        limitations:
          type: string
        concerningChange:
          type: boolean
          description: >-
            True when the measured change is worth raising with a veterinarian.
            This is a prompt to ask a professional, not a diagnosis.
        usedLlm:
          type: boolean
          description: True when a validated model rewrite replaced the rule-based text.
        weightsUsed:
          $ref: "#/components/schemas/AnalysisWeights"
        diagnostics:
          type: object
          additionalProperties: true
          description: >-
            Pipeline-specific debug values. Keys are not part of the stable
            contract and should not be shown to users.
      required:
        - ok
        - pipeline
        - signalQuality
        - signalNote
        - measurements
        - factors
        - observation
        - limitations
        - concerningChange
        - usedLlm

