# Local API. NODE_ENV stays development so this HTTP port is allowed.
# Give the container at least 2 GB. See docs/HOSTING.md for how to measure more.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: development
      PORT: "8080"
      MAX_UPLOAD_MB: "60"
      ANALYSIS_TIMEOUT_MS: "120000"
      ANALYZE_RATE_LIMIT_PER_MINUTE: "10"
    mem_limit: 2g
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/api/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
